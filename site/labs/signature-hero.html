<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111210">
  <meta name="robots" content="noindex">
  <title>Molt — a kinetic metal study by Dharaksh Kataria</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="signature-hero.css">
</head>
<body>
  <main class="gallery" aria-labelledby="title">
    <header class="masthead">
      <a class="identity" href="../index.html">Dharaksh Kataria<span>Independent explorations</span></a>
      <span class="edition">FORM STUDIES <span aria-hidden="true">/</span> 2026</span>
    </header>

    <section class="introduction">
      <p class="eyebrow">A KINETIC METAL STUDY</p>
      <h1 id="title">Matter,<br><em>in motion.</em></h1>
      <p class="description">An exploration of tension, reflection,<br class="desktop-break"> and the moment a surface becomes a form.</p>
    </section>

    <figure class="artwork" aria-label="Molt. An asymmetrical folded liquid-metal sculpture with silver outer surfaces and a warm copper interior.">
      <div class="ground" aria-hidden="true"></div>
      <canvas id="sculpture" aria-label="Interactive three-dimensional metal sculpture"></canvas>
      <div id="unavailable" role="status" hidden>The live sculpture requires WebGL 2. View the saved renders in the prototype screenshots.</div>
    </figure>

    <aside class="art-note" aria-hidden="true"><span>FLUID FORM</span><span>SOLID PRESENCE</span></aside>

    <footer class="caption">
      <div class="work-title"><span class="work-name">Molt</span><span class="materials">Chrome · champagne · copper</span></div>
      <div class="controls"><span id="motion-label">Slowly becoming</span><button id="motion" type="button" aria-label="Pause sculpture animation" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path class="pause-icon" d="M7 6v8M13 6v8"/><path class="play-icon" d="m7 5 8 5-8 5Z"/></svg><span id="motion-action">Pause</span></button></div>
    </footer>
  </main>
  <script type="module" src="signature-hero.js"></script>
</body>
</html>
